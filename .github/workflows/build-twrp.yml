# Build TWRP vendor_boot.img for Redmi Note 14 Pro 5G / POCO X7 (malachite)
# Runs on GitHub Actions and uploads the resulting image as an artifact.
name: Build TWRP vendor_boot (malachite)

env:
  REPO_SYNC_JOBS: 4
  BUILD_JOBS: 1
  MIN_FREE_MB: 20000
  BUILD_DISK_CRIT_MB: 2000
  GOMEMLIMIT: 6GiB
  GOGC: "50"

on:
  workflow_dispatch:
    inputs:
      selinux_permissive:
        description: "Add androidboot.selinux=permissive to the vendor_boot cmdline"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Prepare workspace
        run: |
          echo "CPU: $(nproc --all) | RAM: $(free -g | awk '/Mem:/ {print $2}') GB"
          echo "--- disk before cleanup"; df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /opt/microsoft /opt/google \
            /usr/local/share/powershell /usr/lib/google-cloud-sdk /usr/lib/jvm /usr/share/miniconda \
            /usr/local/julia* /usr/lib/firefox /opt/az || true
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "--- disk after cleanup"; df -h / /mnt || true
          ROOT_MB=$(df -BM --output=avail / | tail -1 | tr -dc '0-9')
          MNT_MB=$(df -BM --output=avail /mnt 2>/dev/null | tail -1 | tr -dc '0-9')
          MNT_MB=${MNT_MB:-0}
          echo "Free: / = ${ROOT_MB} MB, /mnt = ${MNT_MB} MB"
          if [ "$MNT_MB" -gt "$ROOT_MB" ] && [ "$MNT_MB" -gt 15000 ]; then
            WORKDIR=/mnt/twrp; AVAIL=$MNT_MB
            sudo mkdir -p /mnt/twrp && sudo chown -R "$(id -u):$(id -g)" /mnt/twrp
            ln -sfn /mnt/twrp /home/runner/twrp
          else
            WORKDIR=/home/runner/twrp; AVAIL=$ROOT_MB
            mkdir -p /home/runner/twrp
          fi
          echo "WORKDIR=$WORKDIR" >> "$GITHUB_ENV"
          echo "Workspace: $WORKDIR with ${AVAIL} MB free"
          if [ "$AVAIL" -lt "$MIN_FREE_MB" ]; then
            echo "::error::Runner has only ${AVAIL} MB free; need about ${MIN_FREE_MB} MB."
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git-core git-lfs gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 lz4 bc rsync libssl-dev patch
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "builder"
          git config --global user.email "builder@example.com"
          git config --global color.ui false
          sudo apt-get clean

      - name: Sync minimal TWRP manifest (twrp-14.1)
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          (
            while true; do
              A=$(df -BM --output=avail "$WORKDIR" | tail -1 | tr -dc '0-9')
              if [ "${A:-0}" -lt 2000 ]; then
                echo "::error::DISK CRITICAL (${A} MB left), stopping repo sync"
                pkill -f "bin/repo" || true
                break
              fi
              sleep 5
            done
          ) &
          GUARD=$!
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1
          set +e
          repo sync -c -j"${REPO_SYNC_JOBS}" --force-sync --no-clone-bundle --no-tags --retry-fetches 3
          RC=$?
          kill "$GUARD" 2>/dev/null || true
          echo "--- sync result: rc=$RC"; df -h "$WORKDIR"; du -sh .repo . 2>/dev/null || true
          exit "$RC"

      - name: Free space after sync
        run: |
          cd ~/twrp
          du -sh .repo 2>/dev/null || true
          rm -rf .repo
          echo "--- disk after removing .repo"; df -h "$WORKDIR"

      - name: Add swap to survive Soong memory spikes
        run: |
          set -x
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          if sudo fallocate -l 16G /swapfile; then
            echo "swapfile allocated with fallocate"
          else
            echo "fallocate failed, using dd"
            sudo dd if=/dev/zero of=/swapfile bs=1M count=16384 status=progress
          fi
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          if sudo swapon /swapfile; then
            echo "swap enabled"
          else
            echo "::warning::swap could not be enabled; continuing without it"
          fi
          sudo sysctl vm.swappiness=10 || true
          free -h
          df -h /

      - name: Place device tree at the expected path
        run: |
          set -euxo pipefail
          cd ~/twrp
          mkdir -p device/xiaomi
          rm -rf device/xiaomi/malachite
          cp -a "$GITHUB_WORKSPACE/device_tree" device/xiaomi/malachite
          test -f device/xiaomi/malachite/twrp_malachite.mk
          ls -ld device/xiaomi/malachite

      - name: Apply TWRP haptics patch
        run: |
          cd ~/twrp
          PATCH="$PWD/device/xiaomi/malachite/patches/0001-minuitwrp-skip-unavailable-aidl-haptics.patch"
          if git -C bootable/recovery apply --check "$PATCH"; then
            git -C bootable/recovery apply "$PATCH"
            echo "Haptics patch applied with git apply."
          elif patch -d bootable/recovery -p1 --forward --fuzz=3 < "$PATCH"; then
            echo "Haptics patch applied with patch --fuzz=3."
          else
            echo "::warning::Haptics patch did not apply; continuing without it."
          fi

      - name: Fix Android 14 AIDL module names
        run: |
          cd ~/twrp
          if ! grep -R -q --include='Android.mk' -- '-ndk_platform' bootable/recovery; then
            echo "::error::Expected legacy AIDL module names were not found in bootable/recovery"
            exit 1
          fi
          grep -RIlZ --include='Android.mk' -- '-ndk_platform' bootable/recovery | xargs -0 -r sed -i 's/-ndk_platform/-ndk/g'
          if grep -R -n --include='Android.mk' -- '-ndk_platform' bootable/recovery; then
            echo "::error::Legacy AIDL module names remain in bootable/recovery"
            exit 1
          fi
          grep -R -n --include='Android.mk' -- '-ndk' bootable/recovery

      - name: Revert incompatible libtar fscrypt API
        run: |
          set -euo pipefail
          cd ~/twrp
          PATCH="$RUNNER_TEMP/twrp-libtar-fscrypt.patch"
          curl -fsSL \
            https://github.com/TeamWin/android_bootable_recovery/commit/97b849918cf578eec5419de6a8061f11164527af.patch \
            -o "$PATCH"
          if ! git -C bootable/recovery apply --reverse --check --include='libtar/*' "$PATCH"; then
            echo "::error::Could not reverse the incompatible libtar fscrypt API patch"
            exit 1
          fi
          git -C bootable/recovery apply --reverse --include='libtar/*' "$PATCH"
          echo "Reverted the dynamic fscrypt policy changes in libtar."

      - name: Add missing libvold link dependencies
        run: |
          set -euo pipefail
          cd ~/twrp
          python3 - <<'PY'
          from pathlib import Path

          makefile = Path("bootable/recovery/libtar/Android.mk")
          text = makefile.read_text()

          old_static = "LOCAL_STATIC_LIBRARIES += libvold libscrypt_static"
          new_static = old_static + " libasync_safe"
          if new_static not in text:
              if text.count(old_static) != 1:
                  raise SystemExit("Could not find the expected libtar static dependency line")
              text = text.replace(old_static, new_static, 1)

          old_shared = "        libgatekeeper_aidl\n"
          new_shared = (
              "        libgatekeeper_aidl \\\n"
              "        libboot_control_client \\\n"
              "        libsysutils\n"
          )
          if new_shared not in text:
              if text.count(old_shared) != 1:
                  raise SystemExit("Could not find the expected libtar shared dependency list")
              text = text.replace(old_shared, new_shared, 1)

          makefile.write_text(text)
          print("Added libasync_safe, libboot_control_client and libsysutils to libtar.")
          PY

      - name: Build vendor_boot
        env:
          PERM: ${{ inputs.selinux_permissive }}
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export GOMEMLIMIT="${GOMEMLIMIT:-6GiB}"
          export GOGC="${GOGC:-50}"
          if [ "$PERM" = "true" ]; then
            export MALACHITE_RECOVERY_PERMISSIVE=true
          fi

          rm -f "$WORKDIR/disk_critical"
          (
            while true; do
              A=$(df -BM --output=avail "$WORKDIR" | tail -1 | tr -dc '0-9')
              ROOT_A=$(df -BM --output=avail / | tail -1 | tr -dc '0-9')
              if [ "${A:-0}" -lt "$BUILD_DISK_CRIT_MB" ] || [ "${ROOT_A:-0}" -lt "$BUILD_DISK_CRIT_MB" ]; then
                echo "::warning::DISK LOW (workspace=${A:-unknown} MB, root=${ROOT_A:-unknown} MB); not killing the build, just flagging it"
                touch "$WORKDIR/disk_critical"
              fi
              sleep 15
            done
          ) &
          GUARD=$!

          (
            while true; do
              echo "--- heartbeat $(date -u +%H:%M:%S) disk=$(df -h "$WORKDIR" | tail -1 | awk '{print $4}') mem=$(free -m | awk '/Mem:/ {print $7"MB available"}') swap=$(free -m | awk '/Swap:/ {print $3"MB used"}')"
              sleep 60
            done
          ) &
          HEARTBEAT=$!

          set +e
          BUILD_LOG="$HOME/build.log"
          : > "$BUILD_LOG"
          exec > >(tee -a "$BUILD_LOG") 2>&1
          timeout --signal=TERM --kill-after=2m 210m bash -c '
            source build/envsetup.sh
            SOURCE_RC=$?
            if [ "$SOURCE_RC" -ne 0 ]; then
              echo "::error::Sourcing build/envsetup.sh failed with rc=$SOURCE_RC"
              exit "$SOURCE_RC"
            fi
            lunch twrp_malachite-ap2a-eng
            LUNCH_RC=$?
            if [ "$LUNCH_RC" -ne 0 ]; then
              echo "::error::lunch twrp_malachite-ap2a-eng failed with rc=$LUNCH_RC"
              exit "$LUNCH_RC"
            fi
            if ! declare -F mka >/dev/null; then
              echo "::error::build/envsetup.sh did not define the mka function"
              exit 127
            fi
            mka vendorbootimage -j"${BUILD_JOBS}"
          '
          RC=$?
          kill "$GUARD" "$HEARTBEAT" 2>/dev/null || true
          if [ "$RC" -ne 0 ]; then
            echo "--- last 200 lines of build.log"
            tail -n 200 ~/build.log || true
          fi
          echo "--- build result: rc=$RC"; df -h "$WORKDIR"; free -h
          if [ -f "$WORKDIR/disk_critical" ]; then
            echo "::error::Build stopped because free disk space fell below ${BUILD_DISK_CRIT_MB} MB."
            exit 1
          fi
          exit "$RC"

      - name: Verify and stage output
        if: success()
        run: |
          set -euxo pipefail
          IMG=~/twrp/out/target/product/malachite/vendor_boot.img
          test -f "$IMG"
          ls -lh "$IMG"
          sha256sum "$IMG"
          cp "$IMG" "$GITHUB_WORKSPACE/vendor_boot.img"
          python3 - "$GITHUB_WORKSPACE/vendor_boot.img" <<'PY'
          import sys
          p = sys.argv[1]
          with open(p, 'rb') as f:
              magic = f.read(8)
          print('header magic:', magic)
          if magic != b'VNDRBOOT':
              raise SystemExit('not a vendor_boot image: bad magic')
          print('vendor_boot header OK')
          PY

      - name: Upload vendor_boot.img
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vendor_boot-malachite
          path: vendor_boot.img
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /home/runner/build.log
          if-no-files-found: ignore
          retention-days: 30
