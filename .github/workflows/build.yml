name: Build TWRP malachite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses-dev \
            x11proto-core-dev libx11-dev libreadline-dev \
            libgl1-mesa-dev libxml2-utils xsltproc \
            unzip fontconfig rsync libssl-dev \
            libelf-dev python3 python-is-python3

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize TWRP
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"

          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14.1

      - name: Add malachite tree
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          git clone \
            -b A16 \
            --depth=1 \
            https://github.com/mytiantian001/android_device_xiaomi_malachite_twrp.git \
            device/xiaomi/malachite

      - name: Sync sources
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          repo sync -j$(nproc --all)

      - name: Build TWRP
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          source build/envsetup.sh
          lunch twrp_malachite-eng
          mka vendorbootimage -j$(nproc --all)

      - name: Upload vendor_boot.img
        uses: actions/upload-artifact@v4
        with:
          name: malachite-twrp-vendor-boot
          path: twrp/out/target/product/malachite/vendor_boot.img
          if-no-files-found: error
