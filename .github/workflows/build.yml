name: Build TWRP malachite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Set up job
        run: |
          echo "========================================"
          echo " Building TWRP vendor_boot for malachite"
          echo "========================================"
          echo "CPU: $(nproc)"
          free -h
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            lib32ncurses-dev \
            lib32z1-dev \
            libelf-dev \
            libxml2-utils \
            lz4 \
            make \
            openjdk-17-jdk \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      - name: Initialize TWRP
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"

          repo init \
            --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14.1

      - name: Add malachite tree
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/malachite.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>

            <project
              path="device/xiaomi/malachite"
              name="mytiantian001/android_device_xiaomi_malachite_twrp"
              remote="github"
              revision="A16" />

          </manifest>
          EOF

          echo "===== malachite manifest ====="
          cat .repo/local_manifests/malachite.xml

      - name: Sync sources
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          repo sync \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j"$(nproc --all)"

      - name: Check device tree
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          echo "===== Device tree ====="
          ls -la device/xiaomi/malachite

          echo
          echo "===== AndroidProducts.mk ====="
          cat device/xiaomi/malachite/AndroidProducts.mk

          echo
          echo "===== TWRP makefile ====="
          cat device/xiaomi/malachite/twrp_malachite.mk 
          
      - name: Find vendor_boot.img
      run: |
         cd "$GITHUB_WORKSPACE/twrp"

         echo "========================================"
         echo " Searching for vendor_boot.img"
         echo "========================================"

         find out -type f \( -name "vendor_boot.img" -o -name "*vendor_boot*" \) -exec ls -lh {} \; 2>/dev/null || true

       echo
      echo "========================================"
      echo " Product output"
      echo "========================================"

      ls -lah out/target/product/malachite/ 2>/dev/null || true
 
      - name: Upload vendor_boot.img
        uses: actions/upload-artifact@v4
        with:
          name: vendor_boot-malachite
          path: twrp/out/target/product/malachite/vendor_boot.img
          if-no-files-found: error

      - name: Complete job
        if: always()
        run: |
          echo "========================================"
          echo " Workflow finished"
          echo "========================================"
