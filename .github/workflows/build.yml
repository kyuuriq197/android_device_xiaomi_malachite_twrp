name: Build TWRP malachite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Set up job
        run: |
          echo "========================================"
          echo " Building TWRP vendor_boot for malachite"
          echo "========================================"
          echo "CPU: $(nproc)"
          free -h
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libxml2-utils \
            lz4 \
            make \
            openjdk-17-jdk \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      - name: Initialize TWRP
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"

          repo init \
            --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14.1

      - name: Add malachite tree
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/malachite.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>

            <project
              path="device/xiaomi/malachite"
              name="kyuuriq197/android_device_xiaomi_malachite_twrp"
              remote="github"
              revision="A16" />

          </manifest>
          EOF

          echo "===== malachite manifest ====="
          cat .repo/local_manifests/malachite.xml

      - name: Sync sources
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          repo sync \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j"$(nproc --all)"

      - name: Check device tree
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          echo "========================================"
          echo " Device tree"
          echo "========================================"

          ls -la device/xiaomi/malachite

          echo
          echo "===== AndroidProducts.mk ====="
          cat device/xiaomi/malachite/AndroidProducts.mk

          echo
          echo "===== twrp_malachite.mk ====="
          cat device/xiaomi/malachite/twrp_malachite.mk

          echo
          echo "===== device.mk ====="
          cat device/xiaomi/malachite/device.mk

      - name: Initialize and build TWRP
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          echo "========================================"
          echo " Initializing build environment"
          echo "========================================"

          source build/envsetup.sh

          echo
          echo "========================================"
          echo " AndroidProducts.mk"
          echo "========================================"

          cat device/xiaomi/malachite/AndroidProducts.mk

          echo
          echo "========================================"
          echo " twrp_malachite.mk"
          echo "========================================"

          cat device/xiaomi/malachite/twrp_malachite.mk

          echo
          echo "========================================"
          echo " Available lunch targets"
          echo "========================================"

          lunch 2>&1 | head -300

          echo
          echo "========================================"
          echo " Searching malachite"
          echo "========================================"

          grep -Rni "twrp_malachite" \
            device/xiaomi/malachite \
            2>/dev/null || true

          echo
          echo "========================================"
          echo " Selecting TWRP malachite"
          echo "========================================"

          lunch twrp_malachite-ap2a-eng

          echo
          echo "===== Build variables ====="
          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_RELEASE=$TARGET_RELEASE"
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"

          echo
          echo "========================================"
          echo " Building vendor_boot.img"
          echo "========================================"

          mka vendorbootimage -j"$(nproc)"

      - name: Check vendor_boot.img
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          echo "========================================"
          echo " Checking vendor_boot.img"
          echo "========================================"

          if [ ! -f "out/target/product/malachite/vendor_boot.img" ]; then
            echo "ERROR: vendor_boot.img was not generated!"
            echo
            echo "===== Product output ====="
            ls -lah out/target/product/malachite/ 2>/dev/null || true

            echo
            echo "===== Searching all outputs ====="
            find out \
              -type f \
              \( -name "vendor_boot.img" -o -name "*vendor_boot*" \) \
              -exec ls -lh {} \; \
              2>/dev/null || true

            exit 1
          fi

          echo
          echo "===== File ====="
          file out/target/product/malachite/vendor_boot.img

          echo
          echo "===== Size ====="
          ls -lh out/target/product/malachite/vendor_boot.img
          du -h out/target/product/malachite/vendor_boot.img

      - name: Upload vendor_boot.img
        uses: actions/upload-artifact@v4
        with:
          name: vendor_boot-malachite
          path: twrp/out/target/product/malachite/vendor_boot.img
          if-no-files-found: error

      - name: Complete job
        if: always()
        run: |
          echo "========================================"
          echo " Workflow finished"
          echo "========================================"
