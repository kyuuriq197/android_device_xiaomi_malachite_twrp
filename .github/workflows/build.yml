name: Build TWRP malachite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ---------------------------------------------------------
      # 1. Set up job
      # ---------------------------------------------------------
      - name: Set up job
        run: |
          echo "======================================"
          echo "   TWRP build - Xiaomi malachite"
          echo "======================================"
          echo "Runner: $(uname -a)"
          echo "CPU: $(nproc)"
          free -h
          df -h

      # ---------------------------------------------------------
      # 2. Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            adb \
            aria2 \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libncurses6 \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lz4 \
            make \
            openjdk-17-jdk \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # ---------------------------------------------------------
      # 3. Install repo
      # ---------------------------------------------------------
      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          repo --version

      # ---------------------------------------------------------
      # 4. Initialize TWRP
      # ---------------------------------------------------------
      - name: Initialize TWRP
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"

          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-16.0 \
            --depth=1

      # ---------------------------------------------------------
      # 5. Add malachite tree
      # ---------------------------------------------------------
      - name: Add malachite tree
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/malachite.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>

            <project
              path="device/xiaomi/malachite"
              name="mytiantian001/android_device_xiaomi_malachite_twrp"
              remote="github"
              revision="a16" />

          </manifest>
          EOF

          echo "===== Manifest ====="
          cat .repo/local_manifests/malachite.xml

      # ---------------------------------------------------------
      # 6. Sync sources
      # ---------------------------------------------------------
      - name: Sync sources
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          repo sync \
            -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            --force-sync \
            -j"$(nproc)"

      # ---------------------------------------------------------
      # 7. Check device tree
      # ---------------------------------------------------------
      - name: Check malachite tree
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          echo "===== Device tree ====="
          ls -la device/xiaomi/malachite

          echo
          echo "===== AndroidProducts.mk ====="
          if [ -f device/xiaomi/malachite/AndroidProducts.mk ]; then
            cat device/xiaomi/malachite/AndroidProducts.mk
          else
            echo "ERROR: AndroidProducts.mk not found!"
            exit 1
          fi

          echo
          echo "===== BoardConfig ====="
          ls -la device/xiaomi/malachite/BoardConfig*.mk || true

      # ---------------------------------------------------------
      # 8. Build TWRP
      # ---------------------------------------------------------
      - name: Build TWRP
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          echo
          echo "======================================"
          echo " Available malachite lunch targets"
          echo "======================================"

          TARGETS="$(get_build_var COMMON_LUNCH_CHOICES 2>/dev/null \
            | tr ' ' '\n' \
            | grep '^twrp_malachite-' \
            || true)"

          echo "$TARGETS"

          if [ -z "$TARGETS" ]; then
            echo
            echo "ERROR: No twrp_malachite lunch target found!"
            echo
            echo "All TWRP targets:"
            get_build_var COMMON_LUNCH_CHOICES \
              | tr ' ' '\n' \
              | grep -i twrp \
              || true
            exit 1
          fi

          TARGET="$(echo "$TARGETS" | head -n 1)"

          echo
          echo "======================================"
          echo " Selected target: $TARGET"
          echo "======================================"

          lunch "$TARGET"

          echo
          echo "======================================"
          echo " Building recovery"
          echo "======================================"

          mka recoveryimage

          echo
          echo "======================================"
          echo " Build finished"
          echo "======================================"

          echo
          echo "Output directory:"
          ls -lah "out/target/product/malachite/" || true

          echo
          echo "Recovery images:"
          find "out/target/product/malachite/" \
            -maxdepth 1 \
            -type f \
            \( -name "*recovery*.img" -o -name "vendor_boot.img" \) \
            -print

      # ---------------------------------------------------------
      # 9. Prepare artifacts
      # ---------------------------------------------------------
      - name: Prepare artifacts
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          PRODUCT_OUT="out/target/product/malachite"

          echo "===== Searching for output files ====="

          find "$PRODUCT_OUT" \
            -maxdepth 1 \
            -type f \
            -name "*.img" \
            -print || true

          # Recovery
          if [ -f "$PRODUCT_OUT/recovery.img" ]; then
            cp "$PRODUCT_OUT/recovery.img" \
              "$GITHUB_WORKSPACE/artifacts/recovery.img"
          fi

          # Vendor boot, if generated
          if [ -f "$PRODUCT_OUT/vendor_boot.img" ]; then
            cp "$PRODUCT_OUT/vendor_boot.img" \
              "$GITHUB_WORKSPACE/artifacts/vendor_boot.img"
          fi

          # Boot image, if generated
          if [ -f "$PRODUCT_OUT/boot.img" ]; then
            cp "$PRODUCT_OUT/boot.img" \
              "$GITHUB_WORKSPACE/artifacts/boot.img"
          fi

          echo
          echo "===== Artifacts ====="
          ls -lah "$GITHUB_WORKSPACE/artifacts"

      # ---------------------------------------------------------
      # 10. Upload TWRP images
      # ---------------------------------------------------------
      - name: Upload TWRP images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-malachite
          path: artifacts/
          if-no-files-found: error

      # ---------------------------------------------------------
      # 11. Complete job
      # ---------------------------------------------------------
      - name: Complete job
        if: always()
        run: |
          echo
          echo "======================================"
          echo "             BUILD RESULT"
          echo "======================================"

          if [ "${{ job.status }}" = "success" ]; then
            echo "TWRP build completed successfully."
          else
            echo "TWRP build failed."
          fi