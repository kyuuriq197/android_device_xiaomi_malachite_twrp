name: Build TWRP malachite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      - name: Prepare runner
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo " Preparing GitHub Actions runner"
          echo "========================================"

          echo "===== BEFORE CLEANUP ====="
          df -h /

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/Java
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /opt/hostedtoolcache/Python
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo
          echo "===== AFTER CLEANUP ====="
          df -h /

          echo
          echo "===== MEMORY ====="
          free -h

          echo
          echo "===== CPU ====="
          nproc

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libxml2-utils \
            lz4 \
            make \
            openjdk-17-jdk \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

      - name: Install repo
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      - name: Initialize TWRP
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"

          repo init \
            --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14.1

      - name: Add malachite tree
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/twrp"

          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/malachite.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
              <project
                  path="device/xiaomi/malachite"
                  name="kyuuriq197/android_device_xiaomi_malachite_twrp"
                  remote="github"
                  revision="A16" />
          </manifest>
          EOF

          echo "===== MALACHITE MANIFEST ====="
          cat .repo/local_manifests/malachite.xml

      - name: Sync sources
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/twrp"

          echo "========================================"
          echo " Syncing TWRP sources"
          echo "========================================"

          repo sync \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j2

          echo
          echo "===== DISK AFTER SYNC ====="
          df -h /

          echo
          echo "===== MEMORY AFTER SYNC ====="
          free -h

      - name: Check device tree
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/twrp"

          echo "========================================"
          echo " Checking malachite device tree"
          echo "========================================"

          test -f device/xiaomi/malachite/AndroidProducts.mk
          test -f device/xiaomi/malachite/twrp_malachite.mk
          test -f device/xiaomi/malachite/device.mk

          echo
          echo "===== AndroidProducts.mk ====="
          cat device/xiaomi/malachite/AndroidProducts.mk

          echo
          echo "===== twrp_malachite.mk ====="
          cat device/xiaomi/malachite/twrp_malachite.mk

          echo
          echo "===== device.mk ====="
          cat device/xiaomi/malachite/device.mk

      - name: Build vendor_boot
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/twrp"

          echo "========================================"
          echo " Initializing build environment"
          echo "========================================"

          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          ccache -M 10G || true

          source build/envsetup.sh

          echo
          echo "========================================"
          echo " Selecting TWRP malachite"
          echo "========================================"

          lunch twrp_malachite-eng

          echo
          echo "===== BUILD VARIABLES ====="
          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_RELEASE=$TARGET_RELEASE"
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"

          echo
          echo "===== MEMORY ====="
          free -h

          echo
          echo "===== DISK ====="
          df -h /

          echo
          echo "===== CPU ====="
          nproc

          echo
          echo "========================================"
          echo " Building vendor_boot.img"
          echo "========================================"

          mka vendorbootimage -j4

            - name: Build vendor_boot
             shell: bash
             run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/twrp"

          echo "========================================"
          echo " Building TWRP vendor_boot"
          echo "========================================"

          source build/envsetup.sh

          lunch twrp_malachite-eng

          echo "===== BUILD START ====="
          mka vendorbootimage -j"$(nproc)"

          echo "===== BUILD OUTPUT ====="
          ls -lh out/target/product/malachite/

          test -f out/target/product/malachite/vendor_boot.img

          echo "vendor_boot.img successfully built"

          cd "$GITHUB_WORKSPACE/twrp"

          IMG="out/target/product/malachite/vendor_boot.img"

          echo "========================================"
          echo " Checking vendor_boot.img"
          echo "========================================"

          if [ ! -f "$IMG" ]; then
            echo "ERROR: vendor_boot.img was not generated!"
            echo
            ls -lah out/target/product/malachite/ 2>/dev/null || true
            exit 1
          fi

          echo
          echo "===== FILE ====="
          file "$IMG"

          echo
          echo "===== SIZE ====="
          ls -lh "$IMG"
          du -h "$IMG"

      - name: Upload vendor_boot.img
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vendor_boot-malachite
          path: twrp/out/target/product/malachite/vendor_boot.img
          if-no-files-found: error

      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "========================================"
          echo " BUILD FAILED"
          echo "========================================"

          echo
          echo "===== TIME ====="
          date

          echo
          echo "===== DISK ====="
          df -h /

          echo
          echo "===== MEMORY ====="
          free -h

          echo
          echo "===== LOAD ====="
          uptime

          echo
          echo "===== OOM / KILL CHECK ====="
          dmesg 2>/dev/null | \
            grep -Ei \
            'oom|out of memory|killed process|memory cgroup|signal|killed' \
            | tail -100 || true

      - name: Complete job
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo " Workflow finished"
          echo "========================================"
          date
